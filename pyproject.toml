[project]
name = "boring-stuff"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pyyaml",
    "openpyxl",
    "requests>=2.34.2",
    "yt-dlp[build-in-js-interpreter,javascript]>=2026.3.17",
    "quickjs>=1.19.4",
    "googlesearch-python>=1.3.0",
    "pillow>=12.3.0",
    "pyperclip>=1.11.0",
    "pywin32>=312; sys_platform == 'win32'",
    "xmltodict>=1.0.4",
]

[project.scripts]
hello = "scripts.hello:main"
youtube = "cases.webs.youtube:main"
yt = "cases.webs.youtube:main"
clipsave = "cases.wins.clipsave:main"
background = "cases.wins.background:main"
b64d = "cases.devs.base64_clip:main_decode"
b64e = "cases.devs.base64_clip:main_encode"
prune-branches = "cases.devs.prune_branches:main"
json-pretty = "cases.devs.json_pretty:main"
lucky = "cases.webs.lucky:main"
mapit = "cases.maps.mapit:main"
negative = "cases.pictures.negative:main"
pinterest = "cases.webs.pinterest:main"
openwebs = "cases.webs.openwebs:main"
mp4to3 = "cases.webs.mp4to3:main"
shared-drive = "cases.wins.shared_drive:main"

[tool.setuptools.packages.find]
include = ["cases*", "core*", "scripts*"]
namespaces = true

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["cases", "core", "scripts"]

[tool.ruff]
line-length = 120
# rasbpi/ is a standalone legacy Python 2 script, not part of the packaged
# boring-stuff tool suite (not in [tool.setuptools.packages.find], untested).
extend-exclude = ["rasbpi"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "BLE"]
